<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret Banana Room</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            cursor: crosshair; /* gaming cursor! */
        }
        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .ui-layer {
            position: absolute;
            top: 2rem;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 4rem;
            pointer-events: none;
            z-index: 10;
        }
        .score {
            font-size: 4rem;
            font-weight: 700;
            color: var(--text-primary);
            text-shadow: 0 0 20px rgba(0, 255, 127, 0.4);
        }
        .return-btn {
            pointer-events: auto;
            cursor: none; /* Uses custom cursor from style.css */
        }
        #glow {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: radial-gradient(circle at 50% 50%, rgba(255, 235, 59, 0.08) 0%, transparent 70%);
            z-index: -1;
        }
    </style>
</head>
<body>
    <div class="cursor-dot"></div>
    <div id="glow"></div>
    <div class="ui-layer">
        <a href="index.html" class="btn btn-outline return-btn">Return to Base</a>
        <div class="score" id="scoreDisplay">0</div>
    </div>
    <canvas id="gameCanvas"></canvas>
    
    <script src="secret.js"></script>
</body>
</html>
